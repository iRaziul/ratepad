<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="100%" stop-color="#0d0d0f" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Background with rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Main Symbol: Dynamic Exchange Arrows & Keypad Pad Elements -->
  <g filter="url(#glow)">
    <!-- Top Right Arrow (Outgoing / Source) -->
    <path
      d="M 170 190 L 330 190 M 330 190 L 275 135 M 330 190 L 275 245"
      fill="none"
      stroke="url(#whiteGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Bottom Left Arrow (Incoming / Target in Vibrant Emerald) -->
    <path
      d="M 342 322 L 182 322 M 182 322 L 237 267 M 182 322 L 237 377"
      fill="none"
      stroke="url(#greenGrad)"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Accent Keypad Dot Nodes -->
  <circle cx="160" cy="190" r="14" fill="url(#whiteGrad)" />
  <circle cx="352" cy="322" r="14" fill="url(#greenGrad)" />
</svg>